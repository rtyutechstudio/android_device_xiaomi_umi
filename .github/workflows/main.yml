name: Build TWRP for Mi 10 (umi)

on:
  workflow_dispatch:
    inputs:
      device_tree_branch:
        description: 'Device tree branch to build'
        required: true
        default: 'android-11.0-new'
        type: choice
        options:
          - android-11.0-new
          - android-10.0
          - main
      twrp_manifest_branch:
        description: 'TWRP minimal manifest branch (对应 Android 版本)'
        required: true
        default: 'android-11.0'
        type: choice
        options:
          - android-11.0    # 用于 Android 11
          - android-10.0    # 用于 Android 10
          - android-12.0    # 如果未来需要

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip repo
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-twrp-umi-${{ github.event.inputs.device_tree_branch }}
          max-size: 5G

      - name: Initialize repo with selected manifest branch
        run: |
          mkdir -p twrp
          cd twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
            -b ${{ github.event.inputs.twrp_manifest_branch }} --depth=1

      - name: Add device tree with selected branch
        run: |
          cd twrp
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/umi.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project path="device/xiaomi/umi" 
                     name="simonsmh/android_device_xiaomi_umi" 
                     remote="github" 
                     revision="${{ github.event.inputs.device_tree_branch }}" />
          </manifest>
          EOF

      - name: Sync source
        run: |
          cd twrp
          repo sync --force-sync --no-tags --no-clone-bundle -j$(nproc)

      - name: Set up build environment
        run: |
          cd twrp
          source build/envsetup.sh

      - name: Build recovery image
        run: |
          cd twrp
          lunch omni_umi-eng
          mka recoveryimage ALLOW_MISSING_DEPENDENCIES=true
        env:
          CCACHE_EXEC: /usr/bin/ccache
          USE_CCACHE: 1
          CCACHE_DIR: /home/runner/.ccache

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-umi-${{ github.event.inputs.device_tree_branch }}-${{ github.sha }}
          path: twrp/out/target/product/umi/recovery.img
          if-no-files-found: error
